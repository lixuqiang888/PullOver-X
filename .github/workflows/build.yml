name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: 'è¶ç±æ¹æ¡'
        required: false
        default: 'all'
        type: choice
        options: [all, roothide, rootless, rootful]
      configuration:
        description: 'æå»ºéç½®'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

# åä¸åæ¯åç»­çå¹¶åæå»ºèªå¨åæ¶ï¼èç runner ç¨éã
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs: 
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # æå§§ åæ¶å°é dispatchï¼åæ¹ä»¹é æäå¤å¤åååéï¼ + releaseã
        # è¾åºå½¢å¦ {"include":[{"scheme":"roothide","configuration":"release"},...]}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONFIG="${{ inputs.configuration }}"
            if [ "${{ inputs.scheme }}" = "all" ]; then
              SCHEMES="roothide rootless rootful"
            else
              SCHEMES="${{ inputs.scheme }}"
            fi
          else
            CONFIG="release"
            SCHEMES="roothide rootless rootful"
          fi

          MATRIX='{"include":['
          SEP=""
          for S in $SCHEMES; do
            MATRIX="${MATRIX}${SEP}{\"scheme\":\"$S\",\"configuration\":\"$CONFIG\"}"
            SEP=","
          done
          MATRIX="${MATRIX}]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.scheme }} (${{ matrix.configuration }})
    needs: resolve-matrix
    # macos-14 ä¸º Apple Silicon runnerï¼å¯æå»º arm64 + arm64eã
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install ldid & dpkg
        run: |
          brew update >/dev/null
          brew install ldid dpkg
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Restore /opt/theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /opt/theos
          # v2: å« Preferences framework å¤´æä»¶ï¼åä¸æ¬¡æå»ºå ç¼ºå¤´å¤±è´¥ï¼
          key: theos-${{ runner.os }}-v2

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        # åªåé Theos ä¸»ä½ï¼å« vendor å¤´æä»¶ä¸ .tbd é¾æ¥åºï¼ï¼ä¸å¼å­æ¨¡åã
        run: |
          sudo mkdir -p /opt
          sudo chown -R "$USER" /opt
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos

      - name: Install Preferences framework headers
        # Theos ä»åºé»è®¤ä¸å¸¦ Preferences framework å¤´æä»¶ï¼Preferences bundle
        # éè¦ <Preferences/Preferences.h> / <Preferences/PSSpecifier.h> ç­ã
        # è¿äºå¤´æä»¶æ¥èª theos/headers ä»åºï¼æ FrameworkName/<Header>.h ç»ç»ï¼ã
        # ç¨ sparse-checkout åªæ Preferences å­ç®å½ï¼é¿åä¸è½½æ´ä¸ªå¤´æä»¶éåã
        # ç¼å­å½ä¸­æ¶ä¹è¦ä¿è¯è¿äºå¤´å­å¨ï¼ä¹å v1 ç¼å­æ²¡å«å¤´æåçº§ keyï¼ã
        run: |
          if [ ! -d /opt/theos/vendor/include/Preferences ]; then
            git clone --depth=1 --filter=blob:none --no-checkout \
              https://github.com/theos/headers.git /tmp/theos-headers
            cd /tmp/theos-headers
            git sparse-checkout init --cone
            git sparse-checkout set Preferences
            git Checkout HEAD -- Preferences
            mkdir -p /opt/theos/vendor/include
            cp -R Preferences /opt/theos/vendor/include/Preferences
            cd / && rm -rf /tmp/theos-headers
          fi
          ls /opt/theos/vendor/include/Preferences/Preferences.h \
             /opt/theos/vendor/include/Preferences/PSSpecifier.h \
             /opt/theos/vendor/include/Preferences/PSControlTableCell.h

      - name: Build PullOver X
        run: |
          cd "$GITHUB_WORKSPACE"
          ./build.sh "${{ matrix.scheme }}" "${{ matrix.configuration }}"

      - name: Collect .deb artifacts
        run: |
          mkdir -p artifacts
          if ls packages/*.deb 1>/dev/null 2>&1; then
            cp -v packages/*.deb artifacts/
          else
            echo "::error::build.sh æªè¾åºä»»ä½ .deb"
            exit 1
          fi

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PullOverX-${{ matrix.scheme }}-${{ matrix.configuration }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    # ä»å¨æ¨é v* tag æ¶æ .deb æå°å¯¹åº GitHub Releaseã
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .dei artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          pattern: PullOverX-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          fail_on_unmatched_files: true
