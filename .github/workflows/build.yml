name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: '越狱方案'
        required: false
        default: 'all'
        type: choice
        options: [all, roothide, rootless, rootful]
      configuration:
        description: '构建配置'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

# 同一分支后续的并发构建自动取消，节省 runner 用量。
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # 手动触发时尊重 inputs；其乙事件固定三方案 + release。
        # 输出形如 {"include":[{"scheme":"roothide","configuration":"release"},...]}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONFIG="${{ inputs.configuration }}"
            if [ "${{ inputs.scheme }}" = "all" ]; then
              SCHEMES="roothide rootless rootful"
            else
              SCHEMES="${{ inputs.scheme }}"
            fi
          else
            CONFIG="release"
            SCHEMES="roothide rootless rootful"
          fi

          MATRIX='{"include":['
          SEP=""
          for S in $SCHEMES; do
            MATRIX="${MATRIX}${SEP}{\"scheme\":\"$S\",\"configuration\":\"$CONFIG\"}"
            SEP=","
          done
          MATRIX="${MATRIX}]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.scheme }} (${{ matrix.configuration }})
    needs: resolve-matrix
    # macos-14 为 Apple Silicon runner，可构建 arm64 + arm64e。
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install ldid & dpkg
        run: |
          brew update >/dev/null
          brew install ldid dpkg
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Restore /opt/theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /opt/theos
          # v2: 含 Preferences framework 头文件（前一次构建因缺头失败）
          key: theos-${{ runner.os }}-v2

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        # 只克隆 Theos 主体（含 vendor 头文件与 .tbd 链接库），不开子模块。
        run: |
          sudo mkdir -p /opt
          sudo chown -R "$USER" /opt
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos

      - name: Install Preferences framework headers
        # Theos 仓库默认不带 Preferences framework 头文件，Preferences bundle
        # 需要 <Preferences/Preferences.h> / <Preferences/PSSpecifier.h> 等。
        # 这些头文件来自 theos/headers 仓库（按 FrameworkName/<Header>.h 组织）。
        # 用 sparse-checkout 只拉 Preferences 子目录，避免下载整个头文件集合。
        # 缓存命中时也要保证这些头存在（之前 v1 缓存没含头才升级 key）。
        run: |
          if [ ! -d /opt/theos/vendor/include/Preferences ]; then
            git clone --depth=1 --filter=blob:none --no-checkout \
              https://github.com/theos/headers.git /tmp/theos-headers
            cd /tmp/theos-headers
            git sparse-checkout init --cone
            git sparse-checkout set Preferences
            git checkout HEAD -- Preferences
            mkdir -p /opt/theos/vendor/include
            cp -R Preferences /opt/theos/vendor/include/Preferences
            cd / && rm -rf /tmp/theos-headers
          fi
          ls /opt/theos/vendor/include/Preferences/Preferences.h \
             /opt/theos/vendor/include/Preferences/PSSpecifier.h \
             /opt/theos/vendor/include/Preferences/PSControlTableCell.h

      - name: Build PullOver X
        run: |
          cd "$GITHUB_WORKSPACE"
          ./build.sh "${{ matrix.scheme }}" "${{ matrix.configuration }}"

      - name: Collect .deb artifacts
        run: |
          mkdir -p artifacts
          if ls packages/*.deb 1>/dev/null 2>&1; then
            cp -v packages/*.deb artifacts/
          else
            echo "::error::build.sh 未输出任何 .deb"
            exit 1
          fi

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PullOverX-${{ matrix.scheme }}-${{ matrix.configuration }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    # 仅在推送 v* tag 时把 .deb 挂到对应 GitHub Release。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          pattern: PullOverX-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          fail_on_unmatched_files: true
