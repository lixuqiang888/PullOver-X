name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless, rootful]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build
        run: bash ci-build.sh ${{ matrix.scheme }} release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PullOverX-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs
          pattern: PullOverX-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          fail_on_unmatched_files: true
